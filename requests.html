<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f2f2f7">
  <title>Make-up Requests</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body{background:#f2f2f7;-webkit-tap-highlight-color:transparent}
    .card{background:#fff;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.04)}
    :focus-visible{outline:3px solid rgba(59,130,246,.45);outline-offset:3px}
  </style>
</head>
<body>
<div id="app" class="max-w-6xl mx-auto p-4 md:p-8 pb-24">
  <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
    <div>
      <a href="index.html" class="text-xs font-bold text-blue-600 hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Finder</a>
      <h1 class="text-2xl md:text-3xl font-black text-gray-900 mt-2">Make-up Requests</h1>
      <p class="text-sm text-gray-500 mt-1">補堂申請紀錄及待辦清單</p>
    </div>
    <div id="topActions" class="hidden flex-wrap gap-2">
      <button onclick="exportCSV()" class="px-4 py-3 bg-white border border-gray-200 hover:bg-gray-50 rounded-2xl text-sm font-black text-gray-700"><i class="fa-solid fa-file-arrow-down mr-2"></i>Export CSV</button>
      <button onclick="openNewForm()" class="px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl text-sm font-black"><i class="fa-solid fa-plus mr-2"></i>New Request</button>
      <button onclick="lockApp()" class="px-4 py-3 bg-white border border-gray-200 rounded-2xl text-sm font-bold text-gray-600"><i class="fa-solid fa-lock mr-2"></i>Lock</button>
    </div>
  </header>

  <section id="pinPanel" class="card max-w-md mx-auto p-7 md:p-9 mt-12">
    <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center mb-4"><i class="fa-solid fa-lock"></i></div>
    <h2 class="text-xl font-black text-gray-900">Staff Access</h2>
    <p class="text-sm text-gray-500 mt-1 mb-5">Enter the AWSEC staff PIN to view make-up records.</p>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" class="w-full p-4 bg-gray-50 border-2 border-transparent focus:border-blue-500 rounded-2xl font-black tracking-[.35em] text-center text-lg outline-none">
    <button onclick="unlockApp()" class="w-full mt-3 py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-black">Continue</button>
    <p id="pinError" class="hidden text-sm font-bold text-red-600 mt-3">PIN incorrect. Please try again.</p>
  </section>

  <main id="mainPanel" class="hidden">
    <section class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
      <div class="card p-4"><p class="text-[10px] uppercase tracking-widest font-black text-gray-400">All</p><p id="countAll" class="text-2xl font-black mt-1">0</p></div>
      <div class="card p-4"><p class="text-[10px] uppercase tracking-widest font-black text-gray-400">Pending</p><p id="countPending" class="text-2xl font-black mt-1 text-amber-600">0</p></div>
      <div class="card p-4"><p class="text-[10px] uppercase tracking-widest font-black text-gray-400">Added</p><p id="countAdded" class="text-2xl font-black mt-1 text-green-600">0</p></div>
      <div class="card p-4"><p class="text-[10px] uppercase tracking-widest font-black text-gray-400">Future Months</p><p id="countFuture" class="text-2xl font-black mt-1 text-blue-600">0</p></div>
    </section>

    <section class="card p-4 md:p-5 mb-5">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <input id="searchInput" oninput="renderRecords()" type="search" placeholder="Search student / phone / course" class="md:col-span-2 p-3.5 bg-gray-50 rounded-2xl text-sm font-semibold border-2 border-transparent focus:border-blue-500 outline-none">
        <select id="statusFilter" onchange="renderRecords()" class="p-3.5 bg-gray-50 rounded-2xl text-sm font-bold border-2 border-transparent focus:border-blue-500 outline-none"><option value="All">All Status</option><option value="Pending">Pending</option><option value="Added to Schedule">Added to Schedule</option><option value="Cancelled">Cancelled</option></select>
        <input id="monthFilter" onchange="renderRecords()" type="month" class="p-3.5 bg-gray-50 rounded-2xl text-sm font-bold border-2 border-transparent focus:border-blue-500 outline-none">
      </div>
      <div class="flex flex-wrap gap-2 mt-3">
        <button id="quickAll" onclick="setMonthFilter('all')" class="px-3 py-2 rounded-xl bg-blue-600 text-white text-xs font-black">All Months</button>
        <button id="quickThis" onclick="setMonthFilter('this')" class="px-3 py-2 rounded-xl bg-gray-100 text-gray-600 text-xs font-black hover:bg-gray-200">This Month</button>
        <button id="quickNext" onclick="setMonthFilter('next')" class="px-3 py-2 rounded-xl bg-gray-100 text-gray-600 text-xs font-black hover:bg-gray-200">Next Month</button>
        <button onclick="clearFilters()" class="px-3 py-2 rounded-xl text-gray-400 text-xs font-bold hover:text-gray-700">Clear filters</button>
      </div>
    </section>

    <div id="loading" class="text-center py-16 text-gray-500 font-bold"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Loading requests…</div>
    <div id="emptyState" class="hidden card p-10 text-center text-gray-400 font-bold">No matching make-up requests.</div>
    <div id="records" class="space-y-3"></div>
  </main>
</div>

<div id="modal" class="hidden fixed inset-0 z-50 bg-black/30 backdrop-blur-sm p-4 overflow-y-auto">
  <div class="card max-w-2xl mx-auto my-8 p-6 md:p-8">
    <div class="flex justify-between items-start gap-4 mb-5">
      <div><h2 id="modalTitle" class="text-xl font-black">New Make-up Request</h2><p id="modalSubtitle" class="text-xs text-gray-400 mt-1">Only enter what is needed.</p></div>
      <button onclick="closeForm()" class="w-10 h-10 rounded-xl bg-gray-100 text-gray-500"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <label class="text-xs font-black text-gray-500">Student Name *<input id="studentName" class="mt-2 w-full p-3.5 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-blue-300"></label>
      <label class="text-xs font-black text-gray-500">Preferred Name<input id="preferredName" class="mt-2 w-full p-3.5 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-blue-300"></label>
      <label class="text-xs font-black text-gray-500">Phone No.<input id="phoneNo" inputmode="tel" class="mt-2 w-full p-3.5 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-blue-300"></label>
      <label class="text-xs font-black text-gray-500">Original Course *<input id="originalCourse" class="mt-2 w-full p-3.5 bg-gray-50 rounded-xl uppercase outline-none focus:ring-2 focus:ring-blue-300"></label>
      <label class="text-xs font-black text-gray-500">Original Date<input id="originalDate" type="date" class="mt-2 w-full p-3.5 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-blue-300"></label>
      <label class="text-xs font-black text-gray-500">Make-up Course *<input id="makeupCourse" class="mt-2 w-full p-3.5 bg-gray-50 rounded-xl uppercase outline-none focus:ring-2 focus:ring-blue-300"></label>
      <label class="text-xs font-black text-gray-500">Make-up Date *<input id="makeupDate" type="date" class="mt-2 w-full p-3.5 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-blue-300"></label>
      <label class="text-xs font-black text-gray-500">Make-up Session *<input id="makeupSession" type="number" min="1" max="18" class="mt-2 w-full p-3.5 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-blue-300"></label>
      <label class="text-xs font-black text-gray-500">Request Type<select id="requestType" class="mt-2 w-full p-3.5 bg-gray-50 rounded-xl outline-none"><option>Confirmed</option><option>Tentative</option><option>Changed Date</option><option>Other</option></select></label>
      <label class="text-xs font-black text-gray-500">Status<select id="formStatus" class="mt-2 w-full p-3.5 bg-gray-50 rounded-xl outline-none"><option>Pending</option><option>Added to Schedule</option><option>Cancelled</option></select></label>
      <label class="text-xs font-black text-gray-500 md:col-span-2">Remark<textarea id="remark" rows="2" class="mt-2 w-full p-3.5 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-blue-300"></textarea></label>
    </div>
    <p id="formError" class="hidden mt-4 text-sm font-bold text-red-600"></p>
    <div class="flex gap-3 mt-6"><button onclick="closeForm()" class="flex-1 py-3 bg-gray-100 rounded-2xl font-bold text-gray-600">Cancel</button><button id="saveBtn" onclick="saveRequest(false)" class="flex-[2] py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-black">Save Request</button></div>
  </div>
</div>

<script>
const API='https://harjkgpvmlghhiyitvha.supabase.co/functions/v1/makeup-requests';
let staffPin=localStorage.getItem('awsecMakeupPin')||'',allRecords=[],editingId=null,currentRows=[];
const $=id=>document.getElementById(id),toISO=d=>d||null,monthKey=s=>s?s.slice(0,7):'';
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const formatDate=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
const monthValue=(date=new Date())=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;

async function api(path='',options={}){const headers={'Content-Type':'application/json','x-staff-pin':staffPin,...(options.headers||{})};const res=await fetch(API+path,{...options,headers});const data=await res.json().catch(()=>({}));if(!res.ok){const err=new Error(data.error||`HTTP ${res.status}`);err.status=res.status;err.data=data;throw err}return data}
async function unlockApp(){const entered=$('pinInput').value.trim();if(entered)staffPin=entered;$('pinError').classList.add('hidden');try{const data=await api();localStorage.setItem('awsecMakeupPin',staffPin);allRecords=data.records||[];showMain();renderRecords();prefillFromUrl()}catch(e){if(e.status===401){localStorage.removeItem('awsecMakeupPin');staffPin='';$('pinError').classList.remove('hidden');$('pinInput').value='';$('pinInput').focus()}else{$('pinError').textContent='Unable to connect to the request database.';$('pinError').classList.remove('hidden')}}}
function showMain(){$('pinPanel').classList.add('hidden');$('mainPanel').classList.remove('hidden');$('topActions').classList.remove('hidden');$('topActions').classList.add('flex');$('loading').classList.add('hidden')}
function lockApp(){localStorage.removeItem('awsecMakeupPin');staffPin='';location.reload()}
async function reloadRecords(){$('loading').classList.remove('hidden');$('records').innerHTML='';try{const data=await api();allRecords=data.records||[];renderRecords()}catch(e){if(e.status===401)lockApp();else alert('Unable to refresh records.')}finally{$('loading').classList.add('hidden')}}

function renderRecords(){const q=$('searchInput')?.value.trim().toLowerCase()||'',status=$('statusFilter')?.value||'All',month=$('monthFilter')?.value||'',todayMonth=monthValue();$('countAll').textContent=allRecords.length;$('countPending').textContent=allRecords.filter(r=>r.status==='Pending').length;$('countAdded').textContent=allRecords.filter(r=>r.status==='Added to Schedule').length;$('countFuture').textContent=allRecords.filter(r=>monthKey(r.target_month)>todayMonth&&r.status==='Pending').length;currentRows=allRecords.filter(r=>{if(status!=='All'&&r.status!==status)return false;if(month&&monthKey(r.target_month)!==month)return false;if(q&&![r.student_name,r.preferred_name,r.phone_no,r.original_course,r.makeup_course].join(' ').toLowerCase().includes(q))return false;return true});$('emptyState').classList.toggle('hidden',currentRows.length!==0);$('records').innerHTML=currentRows.map(r=>{const statusClass=r.status==='Pending'?'bg-amber-50 text-amber-700 border-amber-100':r.status==='Added to Schedule'?'bg-green-50 text-green-700 border-green-100':'bg-gray-100 text-gray-500 border-gray-200';return `<article class="card p-5 border border-white"><div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4"><div class="min-w-0"><div class="flex flex-wrap items-center gap-2"><h3 class="text-lg font-black text-gray-900">${esc(r.student_name)}</h3>${r.preferred_name?`<span class="text-xs font-bold text-gray-400">(${esc(r.preferred_name)})</span>`:''}<span class="px-2.5 py-1 rounded-lg border text-[10px] font-black ${statusClass}">${esc(r.status)}</span></div><p class="text-xs text-gray-400 mt-1">${esc(r.phone_no||'No phone')} · Updated ${new Date(r.last_updated).toLocaleString()}</p></div><div class="flex items-center gap-2"><select onchange="changeStatus('${r.id}',this.value)" class="p-2.5 bg-gray-50 rounded-xl text-xs font-bold outline-none"><option ${r.status==='Pending'?'selected':''}>Pending</option><option ${r.status==='Added to Schedule'?'selected':''}>Added to Schedule</option><option ${r.status==='Cancelled'?'selected':''}>Cancelled</option></select><button onclick="editRequest('${r.id}')" class="w-10 h-10 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-600" title="Edit request" aria-label="Edit request"><i class="fa-solid fa-pen"></i></button><button onclick="deleteRequest('${r.id}')" class="w-10 h-10 rounded-xl bg-red-50 hover:bg-red-100 text-red-500" title="Delete request" aria-label="Delete request"><i class="fa-solid fa-trash-can"></i></button></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4 text-sm"><div class="bg-gray-50 rounded-2xl p-4"><p class="text-[10px] uppercase tracking-widest font-black text-gray-400">Original</p><p class="font-black text-gray-800 mt-1">${esc(r.original_course)}</p><p class="text-xs text-gray-500 mt-1">${formatDate(r.original_date)}</p></div><div class="bg-blue-50/60 rounded-2xl p-4"><p class="text-[10px] uppercase tracking-widest font-black text-blue-400">Make-up</p><p class="font-black text-gray-900 mt-1">${esc(r.makeup_course)} · Session ${esc(r.makeup_session)}</p><p class="text-xs text-gray-600 mt-1">${formatDate(r.makeup_date)}</p></div></div>${r.remark?`<p class="mt-3 text-xs text-gray-500 bg-gray-50 rounded-xl px-3 py-2"><b>Remark:</b> ${esc(r.remark)}</p>`:''}</article>`}).join('')}

async function changeStatus(id,status){try{await api('',{method:'PATCH',body:JSON.stringify({id,status})});await reloadRecords()}catch(e){alert('Unable to update status.');await reloadRecords()}}
async function deleteRequest(id){const r=allRecords.find(x=>x.id===id);if(!r)return;if(!confirm(`Delete ${r.student_name}'s make-up request?\n\n${r.makeup_course} · Session ${r.makeup_session} · ${formatDate(r.makeup_date)}\n\nThis cannot be undone.`))return;try{await api('',{method:'DELETE',body:JSON.stringify({id})});await reloadRecords()}catch(e){alert('Unable to delete request.')}}

function clearForm(){['studentName','preferredName','phoneNo','originalCourse','originalDate','makeupCourse','makeupDate','makeupSession','remark'].forEach(id=>$(id).value='');$('requestType').value='Confirmed';$('formStatus').value='Pending';$('formError').classList.add('hidden')}
function openNewForm(){editingId=null;clearForm();$('modalTitle').textContent='New Make-up Request';$('modalSubtitle').textContent='Only enter what is needed.';$('saveBtn').textContent='Save Request';$('modal').classList.remove('hidden')}
function closeForm(){$('modal').classList.add('hidden');editingId=null;$('formError').classList.add('hidden')}
function editRequest(id){const r=allRecords.find(x=>x.id===id);if(!r)return;editingId=id;$('studentName').value=r.student_name||'';$('preferredName').value=r.preferred_name||'';$('phoneNo').value=r.phone_no||'';$('originalCourse').value=r.original_course||'';$('originalDate').value=r.original_date||'';$('makeupCourse').value=r.makeup_course||'';$('makeupDate').value=r.makeup_date||'';$('makeupSession').value=r.makeup_session||'';$('requestType').value=r.request_type||'Confirmed';$('formStatus').value=r.status||'Pending';$('remark').value=r.remark||'';$('modalTitle').textContent='Edit Make-up Request';$('modalSubtitle').textContent=`Editing ${r.student_name}`;$('saveBtn').textContent='Save Changes';$('formError').classList.add('hidden');$('modal').classList.remove('hidden')}

function getFormBody(){return{student_name:$('studentName').value.trim(),preferred_name:$('preferredName').value.trim(),phone_no:$('phoneNo').value.trim(),original_course:$('originalCourse').value.trim(),original_date:toISO($('originalDate').value),makeup_course:$('makeupCourse').value.trim(),makeup_date:$('makeupDate').value,makeup_session:Number($('makeupSession').value),request_type:$('requestType').value,status:$('formStatus').value,remark:$('remark').value.trim()}}
async function saveRequest(force){const body=getFormBody();$('formError').classList.add('hidden');if(!body.student_name||!body.original_course||!body.makeup_course||!body.makeup_date||!body.makeup_session){$('formError').textContent='Please complete all required fields.';$('formError').classList.remove('hidden');return}$('saveBtn').disabled=true;$('saveBtn').textContent=editingId?'Saving Changes…':'Saving…';try{if(editingId){await api('',{method:'PATCH',body:JSON.stringify({id:editingId,...body})})}else{await api('',{method:'POST',body:JSON.stringify({...body,force})})}closeForm();clearForm();await reloadRecords()}catch(e){if(!editingId&&e.status===409&&e.data?.error==='duplicate'){if(confirm('A similar make-up request already exists. Save another record anyway?'))return saveRequest(true)}$('formError').textContent=e.message||'Unable to save request.';$('formError').classList.remove('hidden')}finally{$('saveBtn').disabled=false;$('saveBtn').textContent=editingId?'Save Changes':'Save Request'}}

function setMonthFilter(mode){let value='';if(mode==='this')value=monthValue();if(mode==='next'){const d=new Date();d.setMonth(d.getMonth()+1);value=monthValue(d)}$('monthFilter').value=value;['quickAll','quickThis','quickNext'].forEach(id=>{$(id).className='px-3 py-2 rounded-xl bg-gray-100 text-gray-600 text-xs font-black hover:bg-gray-200'});const active=mode==='this'?'quickThis':mode==='next'?'quickNext':'quickAll';$(active).className='px-3 py-2 rounded-xl bg-blue-600 text-white text-xs font-black';renderRecords()}
function clearFilters(){$('searchInput').value='';$('statusFilter').value='All';setMonthFilter('all')}

function csvCell(value){const s=String(value??'');return `"${s.replace(/"/g,'""')}"`}
function exportCSV(){if(!currentRows.length){alert('No records to export.');return}const headers=['Student Name','Preferred Name','Phone No.','Original Course','Original Date','Make-up Course','Make-up Date','Make-up Session','Target Month','Status','Request Type','Remark','Created At','Last Updated'];const rows=currentRows.map(r=>[r.student_name,r.preferred_name,r.phone_no,r.original_course,r.original_date,r.makeup_course,r.makeup_date,r.makeup_session,r.target_month,r.status,r.request_type,r.remark,r.created_at,r.last_updated]);const csv='\uFEFF'+[headers,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`AWSEC_Makeup_Requests_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}

function prefillFromUrl(){const p=new URLSearchParams(location.search),original=p.get('originalCourse'),originalDate=p.get('originalDate'),course=p.get('makeupCourse'),date=p.get('makeupDate'),session=p.get('session');if(original||originalDate||course||date||session){openNewForm();if(original)$('originalCourse').value=original;if(originalDate)$('originalDate').value=originalDate;if(course)$('makeupCourse').value=course;if(date)$('makeupDate').value=date;if(session)$('makeupSession').value=session}}
$('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')unlockApp()});if(staffPin){$('pinInput').value=staffPin;unlockApp()}
</script>
</body>
</html>
